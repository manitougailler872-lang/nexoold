security:
    password_hashers:
        # Le secret ne fait que 6 chiffres (10^6 combinaisons). On compense en
        # rendant chaque essai coûteux. Argon2id avec ces paramètres tient
        # ~250 ms par vérification : imperceptible pour un client, mais il porte
        # une attaque hors-ligne exhaustive à plusieurs jours-GPU par compte.
        App\Entity\User:
            algorithm: 'bcrypt'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: accountNumber

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            custom_authenticators:
                - App\Security\LoginAuthenticator

            # Pas de "form_login" : l'authentification est pilotée par
            # SecurityController, qui n'appelle Security::login() qu'APRÈS
            # validation de l'OTP. Un mot de passe correct seul ne crée
            # aucun jeton de session exploitable.
            entry_point: App\Security\AuthEntryPoint

            logout:
                path: app_logout
                target: app_login
                invalidate_session: true

    access_control:
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/deconnexion, roles: PUBLIC_ACCESS }
        - { path: ^/identite, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/customer, roles: ROLE_CUSTOMER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
